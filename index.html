/* ===== Modelo de ahorro (hipótesis editables; se afinará con datos reales del cliente) ===== */
const AHORRO={
  costeHoraParada:900,   // € por hora de parada no programada (producción perdida)
  horasParada:16,        // horas de una parada no programada media
  repuestos:2500,        // € repuestos medios de un fallo no detectado a tiempo
  manoObra:1320,         // € mano de obra correctiva (24 h x 55 €)
  tiempoNoProductivo:1800, // € arranque, mermas, logística
  // probabilidad estimada de fallo no programado si la máquina se dejara en cada grado
  P:{0:.01,1:.02,2:.03,3:.08,4:.15,5:.28,6:.42,7:.62,8:.78,9:.9,10:.96}
};
function costeFallo(){return AHORRO.costeHoraParada*AHORRO.horasParada+AHORRO.repuestos+AHORRO.manoObra+AHORRO.tiempoNoProductivo;}
function pOf(g){return AHORRO.P[Math.max(0,Math.min(10,g||0))];}
function ahorroCalc(){
  const CF=costeFallo();
  const comp={parada:AHORRO.costeHoraParada*AHORRO.horasParada,repuestos:AHORRO.repuestos,mano:AHORRO.manoObra,tnp:AHORRO.tiempoNoProductivo};
  let total=0,risk=0,per=[],cTot={parada:0,repuestos:0,mano:0,tnp:0};
  DATA.clients.forEach(c=>c.plants.forEach(p=>p.areas.forEach(a=>a.machines.forEach(m=>{
    const g=m.grade||0, pico=Math.max(g,...(m.trend||[]).map(t=>t.g));
    const dP=Math.max(0,pOf(pico)-pOf(g));
    const eur=dP*CF;
    if(eur>0){ total+=eur; per.push({name:a.name+' · '+m.name,pico,g,eur}); for(const k in comp) cTot[k]+=dP*comp[k]; }
    if(g>=5) risk+=pOf(g)*CF;
  }))));
  per.sort((x,y)=>y.eur-x.eur);
  return {CF,total,risk,per,cTot,n:per.length};
}

function emailSummary(cid){

  const crit=all.filter(m=>(m.grade||0)>=5).sort((a,b)=>b.grade-a.grade);

function countStates(plant){
  let c={bueno:0,seg:0,alerta:0,peligro:0,mant:0};
  plant.areas.forEach(a=>a.machines.forEach(m=>c[m.state]++));
  return c;
}
function allMachines(plant){let r=[];plant.areas.forEach(a=>a.machines.forEach(m=>r.push({...m,area:a.name})));return r;}
function plantTechs(plant){
  const order=['Vibraciones','Termografía','Ultrasonidos','Endoscopia','Análisis de aceite'];
  const s=new Set(); plant.areas.forEach(a=>a.machines.forEach(m=>(m.techs||[]).forEach(t=>s.add(t))));
  const arr=[...s]; arr.sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);});
  return arr.length?arr:[plant.loc];
}
function findPlant(cid,pid){const c=DATA.clients.find(x=>x.id===cid);return c&&c.plants.find(p=>p.id===pid);}
function findMachine(cid,pid,mid){const p=findPlant(cid,pid);if(!p)return null;for(const a of p.areas){const m=a.machines.find(x=>x.id===mid);if(m)return {...m,area:a.name};}return null;}

function termoEvo(evo){

/* ===== OTUA en formato ELIS (vibraciones primero, luego termografía) ===== */
const FENCOL={'Desequilibrio':'#1e6fb0','Rodamientos':'#f0a500','Desalineación':'#8e44ad','Holguras':'#2f9e63','Rozamiento':'#d23b3b','Correas':'#b8860b','Soltura':'#6b7280','Engranaje':'#0d9488','Cavitación':'#2563eb','Electromagnético':'#2f6f52'};
const DEFCOL={'Calentamiento moderado':'#e08a00','Calentamiento leve':'#9acd32','Sin anomalía':'#1f9d55','Otros defectos':'#8a97a4'};
function stG(g){return g>=7?'peligro':g>=5?'alerta':g>=3?'seg':'bueno';}
function famOf(m,kind){ if(kind==='termo') return m.area||'Cuadros';
  const w=(m.name||'').replace(/\(.*?\)/g,'').trim().split(/\s+/); return (w[0]||'Máquinas').charAt(0)+ (w[0]||'').slice(1).toLowerCase(); }
function msOfKind(plant,kind){const r=[];plant.areas.forEach(a=>a.machines.forEach(m=>{const isV=!!m.vib;if((kind==='vib')===isV)r.push(Object.assign({area:a.name},m));}));return r;}
// Accumulated improvement = dropped over the last-4 measurement window (peak → current). Última = current < previous.
// banda de color de severidad: verde(1-2) < amarillo(3-4) < naranja(5-6) < rojo(7-10)
function sevBand(g){return g>=7?3:g>=5?2:g>=3?1:0;}
function bandName(r){return ['verde','amarillo','naranja','rojo'][r]||'verde';}
function calcMej(ms){
  const ult=[],year=[];let jumps=0;
  ms.forEach(m=>{const e=(m.evo&&m.evo.length)?m.evo:(m.trend||[]);const s=e.map(x=>x.g).filter(g=>g!=null);
    if(s.length>=2){const last=s[s.length-1],prev=s[s.length-2],peak=Math.max.apply(null,s);
      if(last<prev)ult.push({m:m.name,de:prev,a:last});
      if(last<peak){const bf=sevBand(peak),bt=sevBand(last);const o={m:m.name,de:peak,a:last,bFrom:bf,bTo:bt,jump:bf-bt};year.push(o);if(bf>bt)jumps++;}}});
  return {ult,year,jumps};
}
function qNum(q){
  const M={ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,set:8,oct:9,nov:10,dic:11};
  const s=String(q||'').toLowerCase().replace(/\s+/g,'');
  const mm=s.slice(0,3); let y=parseInt((s.match(/\d+/)||['0'])[0],10);
  if(y<100) y+=2000;
  const mi=(M[mm]!=null)?M[mm]:0;
  return y*12+mi;
}
function bundle(ms,kind){
  const n={bueno:0,seg:0,alerta:0,peligro:0,mant:0};
  ms.forEach(m=>{n[m.state]=(n[m.state]||0)+1;});
  const tot=ms.length, okpct=tot?Math.round((n.bueno)/tot*100):0;
  const detected=ms.filter(m=>m.grade>=3).length;
  const acc=ms.filter(m=>m.recomendacion && m.recomendacion.toUpperCase().indexOf('NO REQUIERE')<0 && m.recomendacion.toUpperCase().indexOf('NO SE DETECTAN')<0 && m.grade>=3);
  // bars from evo
  const labels=[]; ms.forEach(m=>(m.evo||[]).forEach(e=>{if(labels.indexOf(e.q)<0)labels.push(e.q);}));
  labels.sort((a,b)=>qNum(a)-qNum(b));
  const bars=labels.slice(-6).map(q=>{const o={label:q,bueno:0,seg:0,alerta:0,peligro:0};ms.forEach(m=>{const e=(m.evo||[]).find(x=>x.q===q);if(e){o[stG(e.g)]++;}});return o;});
  // byfen
  const fc={};
  if(kind==='vib'){ ms.forEach(m=>{const f=m.fen||{};Object.keys(f).forEach(k=>{if(f[k]>=3)fc[k]=(fc[k]||0)+1;});}); }
  else { ms.forEach(m=>{const d=(m.defecto||'').toLowerCase();let k=(!d||d.indexOf('no se detectan')>=0)?'Sin anomalía':d.indexOf('moderado')>=0?'Calentamiento moderado':d.indexOf('leve')>=0?'Calentamiento leve':'Otros defectos';fc[k]=(fc[k]||0)+1;}); }
  const byfen=Object.keys(fc).sort((a,b)=>fc[b]-fc[a]).map(k=>({c:k,n:fc[k],col:(FENCOL[k]||DEFCOL[k]||'#1e6fb0')}));
  // watch grouped by area/family
  const groups={};
  ms.filter(m=>m.grade>=3).forEach(m=>{const a=famOf(m,kind);(groups[a]=groups[a]||[]).push(m);});
  const watch=Object.keys(groups).map(a=>{const items=groups[a].sort((x,y)=>y.grade-x.grade).map(m=>({n:m.name,g:m.grade,s:m.state,id:m.id,r:m.recomendacion&&m.recomendacion.toUpperCase().indexOf('NO REQUIERE')<0?m.recomendacion:''}));
    const state=items.reduce((w,it)=>stOrder(it.s)>stOrder(w)?it.s:w,'bueno');return {area:a,state,items};}).sort((a,b)=>stOrder(b.state)-stOrder(a.state));
  // mejoras
  const {ult:mejUltL,year:mejYearL,jumps:mejJumps}=calcMej(ms);
  let parosEvit=0; const averiasDet=ms.filter(m=>(m.grade||0)>=3).length;
  ms.forEach(m=>{const e=(m.evo&&m.evo.length)?m.evo:(m.trend||[]);const s=e.map(x=>x.g).filter(g=>g!=null);if(s.length>=2){const last=s[s.length-1],peak=Math.max.apply(null,s);if(peak>=5&&last<peak)parosEvit++;}});
  // ahorro
  const CF=costeFallo(),comp={parada:AHORRO.costeHoraParada*AHORRO.horasParada,repuestos:AHORRO.repuestos,mano:AHORRO.manoObra,tnp:AHORRO.tiempoNoProductivo};
  let total=0,risk=0,per=[],cTot={parada:0,repuestos:0,mano:0,tnp:0};
  ms.forEach(m=>{const g=m.grade||0,pico=Math.max(g,...((m.evo||[]).map(x=>x.g)));const dP=Math.max(0,pOf(pico)-pOf(g));const e=dP*CF;if(e>0){total+=e;per.push({name:m.name,pico,g,eur:e});for(const k in comp)cTot[k]+=dP*comp[k];}if(g>=5)risk+=pOf(g)*CF;});
  per.sort((x,y)=>y.eur-x.eur);
  return {n,tot,okpct,detected,acc,bars,byfen,watch,mejUltL,mejYearL,mejJumps,averiasDet,parosEvit,ahorro:{total,risk,per,cTot,n:per.length}};
}

function adaptVibElis(m,p){
  const grd=m.grade||2;
  const estadoFor=g=> g>=7?'PELIGRO - EFECTO GRAVE':(g>=5?'ATENCIÓN - EFECTO SIGNIFICATIVO':(g>=3?'SATISFACTORIO - EFECTO LEVE':'SATISFACTORIO - EFECTO MENOR'));
  const fenKeys=Object.keys(m.fen||{}).sort((a,b)=>m.fen[b]-m.fen[a]);
  const topFen=fenKeys[0]||'Vibración';
  const anomalia=grd>2;
  const fens=fenKeys.map((k,i)=>({f:k,estado:estadoFor(m.fen[k]),grado:m.fen[k],rec:(i===0&&anomalia)?(m.recomendacion||'VIGILAR EVOLUCIÓN'):'NO REQUIERE INTERVENCIÓN'}));
  const evo=m.evo||[];
  const trend=evo.map(e=>({l:e.q,g:e.g}));
  const edates=evo.map(e=>e.q);
  // per-component SEVERITY GRADE trend (one line per component: Motor, Molino, Soportes…) + predominant fenómeno
  const comps=(m.compHist&&m.compHist.length)
    ? m.compHist.map(c=>({name:c.name,maxgrade:c.maxg,driver:c.driver||'',series:c.series.map(s=>({d:s.d,g:s.g}))}))
    : [{name:'Conjunto',maxgrade:grd,driver:topFen,series:evo.map(e=>({d:e.q,g:e.g}))}];
  let focuspt='—', maxrms=(m.maxrms!=null?m.maxrms:null);
  if(m.pts&&m.pts.length){const top=m.pts.reduce((a,b)=>b[1]>a[1]?b:a);focuspt=top[0];maxrms=top[1];}
  const rms=(m.rmsHist&&m.rmsHist.length?m.rmsHist:null);
  return {...m,grade:grd,fens,note:(m.note||''),trend,rec:anomalia?(m.recomendacion||''):'',
    reports:[{t:'Informe vibraciones — '+p.name+' · '+(m.insp||''),d:m.insp||'',f:'pdf'}],
    comps,edates,maxrms,focuspt,hasValues:!!(m.pts&&m.pts.length)||!!rms,rms};
}
// Desarrolla la nota del analista (texto de los recuadros de la ficha) a prosa con empaque, fiel al texto.
function developNote(raw, rec){
  let t=(raw||'').trim();
  // separar frases pegadas (minúscula seguida de inicio de oración típico del analista)
  t=t.replace(/([a-záéíóúñ])\s+(Se\s|Persiste\b|Aumenta\b|Aumento\b|Desciende\b|Descenso\b|Destaca\b|No se\b|Estabilidad\b)/g,'$1. $2');
  let sentences = t? t.split(/\.\s+|\s{2,}/).map(x=>x.trim()).filter(Boolean) : [];
  const dev = sentences.map(s=>{
    s=s.replace(/\bgrado\s+(\d+)\b/gi,'(grado $1)');
    s=s.replace(/^Estabilidad de la vibración/i,'Se mantiene estable la vibración');
    s=s.replace(/^Aumento de la vibración/i,'Se aprecia un aumento de la vibración');
    s=s.replace(/^Aumenta /i,'Se aprecia un aumento de ');
    s=s.replace(/^Descenso de la vibración/i,'Desciende la vibración');
    s=s.replace(/^Desciende /i,'Desciende ');
    s=s.charAt(0).toUpperCase()+s.slice(1);
    if(!/[.!?]$/.test(s)) s+='.';
    return s;
  });
  // descartar una última frase cortada del informe (acaba en preposición/artículo/conjunción)
  if(dev.length){
    const danglers=/\b(en|de|del|la|el|los|las|un|una|unos|unas|y|o|u|con|a|al|para|por|que|se|su|sus|lo|le|como|sobre|entre|desde|hasta|segun|mas|más)\.?$/i;
    const last=dev[dev.length-1].replace(/[.!?]+$/,'').trim();
    if(danglers.test(last)) dev.pop();
  }
  let out=dev.join(' ');
  if(rec){ const R=rec.trim().replace(/\.$/,''); if(R && !/NO REQUIERE|NO SE DETECT/i.test(R)){ out += (out?' ':'') + 'Se recomienda '+R.toLowerCase()+'.'; } }
  return out.trim();
}

const TECH_REPORTS={
 "Vibración":[["Informe noviembre 2026","06/11/2026"],["Informe mayo 2026","20/05/2026"],["Informe febrero 2026","02/2026"],["Informe octubre 2025","10/2025"],["Informe julio 2025","07/2025"],["Informe mayo 2025","05/2025"],["Informe febrero 2025","02/2025"],["Informe noviembre 2024","11/2024"]]
};
const TECH_ICON_OF={'Vibraciones':'vib','Ultrasonidos':'ultra','Termografía':'ter','Sonido':'son','Alineación':'ali','Equilibrado':'equi','Aceites':'ace','Corriente':'mcsa','Eléctricos':'elec','Espesores':'esp'};
function clientTechs(c){const set=[];scopedPlants(c).forEach(p=>p.areas.forEach(a=>a.machines.forEach(m=>(m.techs||[]).forEach(t=>{if(set.indexOf(t)<0)set.push(t);}))));return set;}
// "sep.26" -> "Sep. 2026"
function periodLabel(q){const s=String(q||'').toLowerCase().replace(/\s+/g,'');const mm=s.slice(0,3);let y=(s.match(/\d+/)||['0'])[0];if(y.length<=2)y='20'+('0'+y).slice(-2);return mm.charAt(0).toUpperCase()+mm.slice(1)+'. '+y;}
// campañas reales (periodos distintos) de una planta para una técnica, más reciente primero; ventana de 12 meses móviles desde el último informe
function plantPeriods(p,kind){
  const set=[];
  p.areas.forEach(a=>a.machines.forEach(m=>{const isT=(m.tmax!==undefined),isV=!!m.vib;if((kind==='termo'&&isT)||(kind==='vib'&&isV)){(m.evo||[]).forEach(e=>{if(e.q&&set.indexOf(e.q)<0)set.push(e.q);});}}));
  set.sort((a,b)=>qNum(b)-qNum(a));
  if(set.length){const top=qNum(set[0]);return set.filter(q=>top-qNum(q)<12);} // 12 meses móviles
  return set;
}
function techReports(c,tech){
  const kind=(tech==='Termografía')?'termo':(tech==='Vibraciones'||tech==='Ultrasonidos')?'vib':null;
  if(!kind) return TECH_REPORTS[tech]||[];
  const r=[];
  scopedPlants(c).forEach(p=>{const pn=p.name.replace('Planta ','');plantPeriods(p,kind).forEach(q=>{const L=periodLabel(q);r.push(['Informe '+tech.toLowerCase()+' — '+pn+' · '+L,L]);});});
  return r;
}

        <div><b style="font-size:15px">${t[1]}</b><div style="color:var(--muted);font-size:12px">${reps.length?reps.length+" informes disponibles":"Sin informes todavía"}</div></div>
      </div>
      ${reps.length?`<div style="margin-top:12px">`+reps.map(r=>`<div class="rep"><div class="ic">PDF</div><div class="meta"><b>${r[0]}</b><span>${r[1]}</span></div>${dlBtn('Abrir')}</div>`).join("")+`</div>`:`<div style="margin-top:10px;color:var(--muted);font-size:12.5px;background:#f8fafc;border-radius:8px;padding:10px 12px">Ingenor subirá aquí los informes de ${t[1].toLowerCase()} cuando se realice este servicio.</div>`}
    </div>`;
  }).join("");
  return `<main>
    <h1>Técnicas e informes</h1>
    <p class="sub">${isAdmin?'Catálogo de técnicas de Ingenor.':'Las técnicas que Ingenor realiza en tus plantas y sus informes, descargables en PDF.'}</p>
    <div class="grid c2">${cards}</div>
  </main>`;
}
function dlBtn(label){label=label||'Descargar';
  if(session&&session.canDownload===false) return `<span class="btn ghost sm" style="opacity:.5;cursor:not-allowed" title="Los técnicos solo suben informes, no los descargan">🔒 Sin descarga</span>`;
  return `<button class="btn ghost sm" onclick="doDownload()">${label}</button>`;
}
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#0f2a43;color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:9999;font-size:13px;max-width:86%;text-align:center;transition:opacity .3s';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(window._tt);window._tt=setTimeout(()=>{t.style.opacity='0';},2800);
}
/* ============================================================= RENDER */
function render(){
  if(!session){$("#app").innerHTML=renderLogin();return;}
  let body="";
  try{
    switch(view.name){
      case "plants":body=renderPlants();break;
      case "plant":body=renderPlant();break;
      case "machine":body=renderMachine();break;
      case "upload":body=renderUpload();break;
      case "users":body=renderUsers();break;
      case "tecnicas":body=renderTecnicas();break;
      case "dash":{const _c=DATA.clients.find(x=>x.id===(session.role==='admin'?view.cid:session.clientId));body=(_c&&_c.plants&&_c.plants.some(p=>p.areas.some(a=>a.machines.some(m=>m.vib||m.tmax!==undefined))) && _c.id!=='elis')?renderOtuaView('dash'):renderDash();break;}
      case "stats":{const _c=DATA.clients.find(x=>x.id===(session.role==='admin'?view.cid:session.clientId));body=(_c&&_c.id!=='elis'&&_c.plants&&_c.plants.some(p=>p.areas.some(a=>a.machines.some(m=>m.vib||m.tmax!==undefined))))?renderOtuaView('stats'):renderStats();break;}
      default:body=renderPlants();
    }
  }catch(e){
    console.error('render error',view,e);
    body=`<main><div class="card pad" style="border-left:4px solid var(--g-peligro)"><b>No se pudo abrir esta vista</b><p style="color:var(--muted);font-size:12.5px;margin:6px 0 0">${(e&&e.message)||e}</p><button class="btn ghost sm" style="margin-top:10px" onclick="go({name:'plants'})">← Volver a plantas</button></div></main>`;
  }
  $("#app").innerHTML=renderHeader()+body;
}
render();
</script>
</body>
</html>
